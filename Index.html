<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>POS Refacciones</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    .filtros, .carrito, .modal { margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    .modal {
      display: none;
      position: fixed;
      top: 20%;
      left: 30%;
      width: 40%;
      background: #fff;
      border: 2px solid #333;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,.3);
    }
    .modal.activo { display: block; }
  </style>
</head>
<body>

<h2>Venta de refacciones</h2>

<div class="filtros">
  <label>Marca:
    <select id="marca">
      <option value="">Selecciona</option>
      <option value="ACURA">ACURA</option>
      <option value="BMW">BMW</option>
      <option value="FORD">FORD</option>
    </select>
  </label>

  <label>Modelo:
    <select id="modelo">
      <option value="">Selecciona</option>
    </select>
  </label>

  <label>Año:
    <input type="number" id="anio" placeholder="Ej. 2006">
  </label>

  <label>Motor:
    <input type="text" id="motor" placeholder="Ej. 2.0 L4">
  </label>

  <button onclick="filtrar()">Filtrar</button>
</div>

<table id="productos">
  <thead>
    <tr>
      <th>#APA</th>
      <th>Descripción</th>
      <th>Precio</th>
      <th>Stock</th>
      <th></th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<h3>Carrito</h3>
<table id="carrito">
  <thead>
    <tr>
      <th>#APA</th>
      <th>Descripción</th>
      <th>Cantidad</th>
      <th>Precio</th>
      <th>Importe</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<h3>Total: $<span id="total">0.00</span></h3>
<button onclick="abrirPago()">COBRAR</button>

<!-- Modal de pago -->
<div class="modal" id="modalPago">
  <h3>Cobrar</h3>
  <p>Total: $<span id="totalModal">0.00</span></p>

  <label>Forma de pago:
    <select id="formaPago">
      <option value="EFECTIVO">Efectivo</option>
      <option value="TARJETA">Tarjeta</option>
      <option value="TRANSFERENCIA">Transferencia</option>
      <option value="MIXTO">Mixto</option>
    </select>
  </label>

  <p>Recibido: $<input type="number" id="recibido" oninput="calcularCambio()"></p>
  <p>Cambio: $<span id="cambio">0.00</span></p>

  <button onclick="confirmarVenta()">Confirmar venta</button>
  <button onclick="cerrarPago()">Cancelar</button>
</div>

<script>
let carrito = [];

function filtrar() {
  const marca = document.getElementById('marca').value;
  const modelo = document.getElementById('modelo').value;
  const anio = document.getElementById('anio').value;
  const motor = document.getElementById('motor').value;

  // Aquí iría fetch al backend:
  // fetch(`/api/productos?marca=${marca}&modelo=${modelo}&anio=${anio}&motor=${motor}`)
  // .then(res => res.json())
  // .then(data => renderProductos(data));

  // Simulación:
  const productos = [
    { id: 1, apa: '16579', desc: 'Soporte motor', precio: 450, stock: 3 },
    { id: 2, apa: '18898', desc: 'Soporte transmisión', precio: 520, stock: 1 },
  ];
  renderProductos(productos);
}

function renderProductos(productos) {
  const tbody = document.querySelector('#productos tbody');
  tbody.innerHTML = '';
  productos.forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${p.apa}</td>
      <td>${p.desc}</td>
      <td>$${p.precio.toFixed(2)}</td>
      <td>${p.stock}</td>
      <td><button onclick="agregar(${p.id}, '${p.apa}', '${p.desc}', ${p.precio})">Agregar</button></td>
    `;
    tbody.appendChild(tr);
  });
}

function agregar(id, apa, desc, precio) {
  const item = carrito.find(x => x.id === id);
  if (item) {
    item.cantidad++;
  } else {
    carrito.push({ id, apa, desc, precio, cantidad: 1 });
  }
  renderCarrito();
}

function renderCarrito() {
  const tbody = document.querySelector('#carrito tbody');
  tbody.innerHTML = '';
  let total = 0;

  carrito.forEach(item => {
    const importe = item.precio * item.cantidad;
    total += importe;

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${item.apa}</td>
      <td>${item.desc}</td>
      <td>${item.cantidad}</td>
      <td>$${item.precio.toFixed(2)}</td>
      <td>$${importe.toFixed(2)}</td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById('total').textContent = total.toFixed(2);
}

function abrirPago() {
  const total = parseFloat(document.getElementById('total').textContent);
  if (total <= 0) {
    alert('El carrito está vacío');
    return;
  }
  document.getElementById('totalModal').textContent = total.toFixed(2);
  document.getElementById('recibido').value = '';
  document.getElementById('cambio').textContent = '0.00';
  document.getElementById('modalPago').classList.add('activo');
}

function cerrarPago() {
  document.getElementById('modalPago').classList.remove('activo');
}

function calcularCambio() {
  const total = parseFloat(document.getElementById('totalModal').textContent);
  const recibido = parseFloat(document.getElementById('recibido').value) || 0;
  const cambio = recibido - total;
  document.getElementById('cambio').textContent = cambio >= 0 ? cambio.toFixed(2) : '0.00';
}

function confirmarVenta() {
  const total = parseFloat(document.getElementById('totalModal').textContent);
  const recibido = parseFloat(document.getElementById('recibido').value) || 0;
  const cambio = recibido - total;

  if (recibido < total) {
    alert('El monto recibido es menor al total');
    return;
  }

  // Aquí iría POST /api/ventas
  console.log('Venta confirmada', {
    items: carrito,
    total,
    recibido,
    cambio,
    formaPago: document.getElementById('formaPago').value
  });

  alert(`Venta realizada. Cambio: $${cambio.toFixed(2)}`);
  carrito = [];
  renderCarrito();
  cerrarPago();
}
</script>

</body>
</html>
